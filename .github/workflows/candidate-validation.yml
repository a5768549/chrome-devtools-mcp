name: Candidate validation (fork only)

on:
  push:
    branches:
      - verify/chrome-pr-20261026

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.candidate }} / Linux Node 22
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - candidate: browser-889
            sha: 321648572c63091ed221961aa81fe6d22b5e30ea
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: a5768549/chrome-devtools-mcp
          ref: ${{ matrix.sha }}
          submodules: true
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - name: Record provenance
        run: |
          git rev-parse HEAD
          git submodule status
          node --version
          npm --version
      - name: Install locked dependencies and browser
        run: npm ci
      - name: Match upstream Linux browser sandbox setup
        run: echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns
      - name: Build bundle
        run: npm run bundle
        env:
          NODE_OPTIONS: --max_old_space_size=4096
      - name: Full test suite
        run: npm run test -- --test-concurrency=1
        env:
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
      - name: Notice tests
        if: ${{ !cancelled() }}
        run: npm run test:notices:no-build
      - name: Typecheck
        if: ${{ !cancelled() }}
        run: npm run typecheck
      - name: Check format
        if: ${{ !cancelled() }}
        run: npm run check-format
      - name: Verify generated files
        if: ${{ !cancelled() }}
        run: |
          npm run gen
          git diff --exit-code
