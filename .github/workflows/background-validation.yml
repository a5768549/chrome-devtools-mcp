name: Background emulation validation (fork only)

on:
  push:
    branches:
      - verify/chrome-bg-806-20261026

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.candidate }} / Linux Node 22
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - candidate: baseline-172656a
            sha: 172656ab38a4ff666f88dc9032fa841834a69495
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: a5768549/chrome-devtools-mcp
          ref: ${{ matrix.sha }}
          submodules: true
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - name: Record provenance
        run: |
          git rev-parse HEAD
          git submodule status
          node --version
          npm --version
      - name: Install locked dependencies and browser
        run: npm ci
      - name: Match upstream Linux browser sandbox setup
        run: echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns
      - name: Build bundle
        run: npm run bundle
        env:
          NODE_OPTIONS: --max_old_space_size=4096
      - name: Full test suite
        run: npm run test -- --test-concurrency=1 --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination="$RUNNER_TEMP/full-tests.xml"
        env:
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
      - name: Record structured test results
        if: ${{ !cancelled() }}
        run: |
          python -c 'import os, pathlib, xml.etree.ElementTree as E, json, hashlib; p=pathlib.Path(os.environ["RUNNER_TEMP"])/"full-tests.xml"; b=p.read_bytes(); r=E.fromstring(b); print("JUNIT_SHA256",hashlib.sha256(b).hexdigest()); print("JUNIT_ROOT",r.attrib); print("JUNIT_CASES",json.dumps([{**t.attrib,"outcomes":[x.tag for x in t]} for t in r.iter("testcase")])); print("JUNIT_SUITES",json.dumps([t.attrib for t in r.iter("testsuite")]))'
      - name: Notice tests
        if: ${{ !cancelled() }}
        run: npm run test:notices:no-build
      - name: Typecheck
        if: ${{ !cancelled() }}
        run: npm run typecheck
      - name: Check format
        if: ${{ !cancelled() }}
        run: npm run check-format
      - name: Verify generated files
        if: ${{ !cancelled() }}
        run: |
          npm run gen
          git diff --exit-code
